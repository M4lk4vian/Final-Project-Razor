<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Warming up...</title>
        <style>
            body{
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100vh;
                margin: 0;
                background-color: #1a1a1a;
                font-family: Arial, sans-serif;
                color: white;
            }

            #message{
                margin-top: 20px;
                font-size: 1.2rem;
                animation: pulse 1.5s ease-in-out infinite;
            }

            @keyframes pulse{
                0%, 100%{
                    transform: scale(1);
                    opacity: 1;
                }
                50%{
                    transform: scale(1.1);
                    opacity: 0.7;
                }
            }
        </style>
    </head>
    <body>

        <p id="message">Warming up your meals<span id="dots">.</span></p>

        <script>
            const targetUrl = "https://final-project-razor-a6d2acf0egeqche3.francecentral-01.azurewebsites.net/";
            const messageEl = document.getElementById("message");
            const dotsEl = document.getElementById("dots");

            let dotCount = 1;
            setInterval(() => {
                dotCount = (dotCount % 3) + 1;
                dotsEl.textContent = ".".repeat(dotCount);
            }, 500);

            async function checkIfReady(){
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 6000);

                try{
                    await fetch(targetUrl, {mode: "no-cors", signal: controller.signal});
                    clearTimeout(timeoutId);
                    return true;
                }   catch (error) {
                    clearTimeout(timeoutId);
                    return false;
                }

            }

            async function waitForSite() {
                const startTime = Date.now();
                const minDisplayTime = 5000;
                while (true) {
                    const ready = await checkIfReady();
                    if (ready) {
                        const elapsed = Date.now() - startTime;
                        const remaining = minDisplayTime - elapsed;
                        if (remaining > 0) {
                            await new Promise(resolve => setTimeout(resolve, remaining));
                        }
                        messageEl.textContent = "Ready! Showing your meals!";
                        window.location.href = targetUrl;
                        return;
                    }

                    await new Promise(resolve => setTimeout(resolve, 2000));
                }
            }

            waitForSite();
        </script>

    </body>
</html>
